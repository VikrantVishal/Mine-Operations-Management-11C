<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Login — Deposit-11C Attendance</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- Preload background engine scripts as early as possible so the animated
     background is ready with no flash/delay once the page paints -->
<link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js" as="script">
<link rel="preload" href="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js" as="script">
<!-- Loaded with "defer" (not placed at the bottom of body) so the browser
     starts fetching them immediately, in parallel with everything else,
     instead of waiting until the rest of the page has been parsed first -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>
<style>
  /* Fixed full-viewport layer for the Vanta canvas */
  #vanta-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
  }

  body { position: relative; z-index: 0; }
  .login-wrap { position: relative; z-index: 10; }

  /* Glassmorphic Login Card */
  .login-card {
    background: rgba(22, 30, 41, 0.45) !important;
    backdrop-filter: blur(16px) saturate(180%);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.12) !important;
    border-top: 1px solid rgba(255, 255, 255, 0.25) !important;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.1) !important;
    border-radius: 14px;
  }

  /* Frosted Input Fields */
  .login-card input {
    background: rgba(13, 17, 23, 0.5) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    color: #fff !important;
  }

  .login-card input:focus {
    border-color: rgba(245, 166, 35, 0.6) !important;
    box-shadow: 0 0 12px rgba(245, 166, 35, 0.25) !important;
    outline: none;
  }
</style>
</head>
<body>
<div id="vanta-bg"></div>

<div class="login-wrap">
  <div class="login-card">
    <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" style="width:52px; height:52px; margin:0 auto 10px; display:block;">
      <circle cx="32" cy="32" r="30" fill="#161e29" stroke="#f5a623" stroke-width="2"/>
      <g fill="#f5a623">
        <circle cx="18" cy="24" r="6"/><rect x="12" y="30" width="12" height="16" rx="3"/>
        <circle cx="32" cy="20" r="7"/><rect x="25" y="27" width="14" height="19" rx="3"/>
        <circle cx="46" cy="24" r="6"/><rect x="40" y="30" width="12" height="16" rx="3"/>
      </g>
      <rect x="10" y="20" width="10" height="4" rx="2" fill="#4fa3e3"/>
      <rect x="24" y="15" width="12" height="4" rx="2" fill="#4fa3e3"/>
      <rect x="38" y="20" width="10" height="4" rx="2" fill="#4fa3e3"/>
    </svg>
    <h1>DEPOSIT‑11C</h1>
    <div class="sub">Attendance Management — Sign In</div>

    <form id="loginForm" autocomplete="off">
      <label>Username</label>
      <input type="text" id="username" autocapitalize="characters" placeholder="e.g. VIKRANT" required>
      <label style="margin-top:12px;">Password</label>
      <input type="password" id="password" required>
      <div id="loginError"></div>
      <button type="submit" class="btn-amber" id="loginBtn" style="width:100%; margin-top:16px;">Sign In</button>
    </form>
  </div>
</div>

<script type="module">
import { login, getSession } from "./auth.js";

const params = new URLSearchParams(window.location.search);
const redirect = params.get('redirect') || 'index.html';
const reason = params.get('reason');

if (getSession()) {
  window.location.href = redirect;
}

const form = document.getElementById('loginForm');
const errBox = document.getElementById('loginError');
const btn = document.getElementById('loginBtn');

if (reason === 'timeout') {
  errBox.textContent = 'You were signed out after 10 minutes of inactivity. Please sign in again.';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errBox.textContent = '';
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    await login(username, password);
    window.location.href = redirect;
  } catch (err) {
    errBox.textContent = err.message || 'Login failed.';
    btn.disabled = false; btn.textContent = 'Sign In';
  }
});
</script>

<!-- ─── VANTA BACKGROUND ─── -->
<script>
  document.addEventListener("DOMContentLoaded", function() {
    if (window.VANTA) {
      window.VANTA.FOG({
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        highlightColor: 0x0d0f14,
        midtoneColor: 0xffffff,
        lowlightColor: 0x181e2a,
        baseColor: 0x0d0f14,
        blurFactor: 0.48,
        speed: 0.20,
        zoom: 0.15
      });
    }
  });
</script>

</body>
</html>
